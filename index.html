    .tabs { display:flex; flex-wrap:wrap; gap:0.5rem; margin-bottom:1rem; }
    .tab { border:2px solid transparent; padding:0.55rem 1rem; border-radius:8px; font-weight:700; cursor:pointer; font-size:0.85rem; color:white; transition:0.15s; }
    .tab.active { opacity:1; border-color:#fff; transform:translateY(-1px); }
    .logo-badge { vertical-align: middle; margin-right: 8px; }
    .logo-badge circle, .logo-badge ellipse { transition: transform 0.3s; }
    .logo-badge:hover circle, .logo-badge:hover ellipse { transform: scale(1.05); }
    .tab-TOATE { background:#64748b; }
    .tab-MB { background:#1e3a8a; }
    .tab-RENAULT { background:#b45309; }
    .tab-VW { background:#1d4ed8; }
    .tab-PIECE { background:#6d28d9; }
    .tab-ELEC { background:#b45309; }
    .tab.active { box-shadow: 0 0 0 2px #fff; }
    .tab.active.TOATE { background:#475569; }
    .tab.active.MB { background:#1e3a8a; }
    .tab.active.RENAULT { background:#b45309; }
    .tab.active.VW { background:#1d4ed8; }
    .tab.active.PIECE { background:#6d28d9; }
    .tab.active.ELEC { background:#b45309; }
    .no-results { padding:2rem; text-align:center; color:#64748b; }
    .row { display:grid; grid-template-columns: 1fr 1fr; gap:1rem; }
    .card { border:1px solid #e2e8f0; border-radius:8px; padding:1rem; background:white; border-top:4px solid #dc2626; }
    .card.MB { border-top-color: #1e3a8a; }
    .card.RENAULT { border-top-color: #b45309; }
    .card.VW { border-top-color: #1d4ed8; }
    .card.PIECE { border-top-color: #6d28d9; }
    .card.ELEC { border-top-color: #b45309; }
    .card.TOATE { border-top-color: #475569; }
    .card-top { display:flex; gap:0.5rem; margin-bottom:0.5rem; flex-wrap:wrap; }
    .badge { display:inline-block; padding:0.25rem 0.5rem; border-radius:4px; font-size:0.75rem; font-weight:700; color:white; text-transform:uppercase; }
    .badge-cod { background:#3b82f6; }
    .badge-marca { background:#64748b; }
    .badge-sev { padding:0.25rem 0.4rem; }
    .badge-sev-Ridicată { background:#ef4444; }
    .badge-sev-Medie { background:#f59e0b; }
    .badge-sev-Normală { background:#10b981; }
    .titlu { font-weight:700; margin-bottom:0.5rem; }
    .sec { background:#f1f5f9; padding:0.5rem; border-radius:4px; margin-bottom:0.5rem; }
    .detalii { border-top:1px solid #e2e8f0; padding-top:0.5rem; display:none; }
    .detalii.open { display:block; }
    .causelist { display:grid; grid-template-columns: 1fr 1fr; gap:0.25rem; margin:0.25rem 0; }
    .causelist span { background:#e0f2fe; color:#0369a1; padding:0.2rem 0.4rem; border-radius:3px; font-size:0.75rem; }
    .btn-detalii { margin-top:0.5rem; padding:0.4rem 1rem; background:#3b82f6; color:white; border:none; border-radius:4px; cursor:pointer; font-size:0.8rem; }
    .btn-detalii:hover { background:#2563eb; }
    .status { padding:0.5rem; background:#dcfce7; color:#166534; border-radius:4px; font-size:0.85rem; margin-bottom:1rem; }
    .status.error { background:#fee2e2; color:#991b1b; }
    @media (max-width: 600px) {
      .row { grid-template-columns: 1fr; }
      .causelist { grid-template-columns: 1fr; }

        // Build tags mapping for fast filtering
        const tags = {};
        CODURI.forEach(c => {
            if (!tags[c.marca]) tags[c.marca] = [];
            tags[c.marca].push(c);
        });

        const container = document.getElementById('cardsContainer');
        const tabContainer = document.getElementById('tabContainer');
        const searchInput = document.getElementById('searchInput');

        // Default state: collapsed except for PIECE and ELEC
        let visibleCategories = ['PIECE', 'ELEC'];
        let currentFilter = 'PIECE';

        function renderCards(category, filter) {
            const results = [];
            if (filter === 'TOATE') {
                results.push(...CODURI);
            } else {
                results.push(...tags[filter] || []);
            }

            // Apply search filter
            const query = searchInput.value.toLowerCase().trim();
            let finalResults = results;
            if (query) {
                finalResults = results.filter(c => {
                    const cod = c.cod.toLowerCase();
                    const marca = c.marca.toLowerCase();
                    const sistem = c.sistem.toLowerCase();
                    const titlu = c.titlu.toLowerCase();
                    const cauze = c.cauze.join(' ').toLowerCase();
                    const simptombe = c.simptombe.toLowerCase();
                    const verif = c.verif.toLowerCase();
                    return (cod.includes(query) || marca.includes(query) || sistem.includes(query) ||
                            titlu.toLowerCase().includes(query) || cauze.includes(query) || simptombe.includes(query) || verif.includes(query));
                });
            }

            if (finalResults.length === 0) {
                container.innerHTML = `<div class="no-results">Niciun rezultat pentru "${query}"</div>`;
                return;
            }

            let html = '';
            finalResults.forEach(c => {
                const keywords = [c.cod, c.marca, c.sistem, c.titlu].join(' ').split(' ').filter(w => w.length > 2).slice(0, 5).map(w => `<span class="keyword">${w}</span>`).join(' ');
                html += `
                    <div class="card ${c.marca.toLowerCase()}">
                        <div class="card-head">
                            <div>
                                <div class="card-title">${c.titlu}</div>
                                <div class="code-value">Cod: ${c.cod} &nbsp;|&nbsp; Sistem: ${c.sistem}</div>
                            </div>
                            <span class="badge ${c.sev.toLowerCase()}">${c.sev}</span>
                        </div>
                        <div class="detalii">
                            <h3>Detalii tehnice</h3>
                            <div class="row">
                                <label>Cod:</label><div><span class="code-value">${c.cod}</span></div>
                                <label>Marță:</label><div><span class="code-value">${c.marca}</span></div>
                                <label>Sistem:</label><div><span class="code-value">${c.sistem}</span></div>
                            </div>
                            <div class="row">
                                <label>Expunere:</label><div>${c.exp}</div>
                                <label>Cauze comune:</label><div>${c.cauze.join(', ')}</div>
                            </div>
                            <div class="row">
                                <label>Simptome:</label><div>${c.simptombe}</div>
                                <label>Verificare:</label><div>${c.verif}</div>
                            </div>
                        </div>
                        <button class="toggle-btn" onclick="toggleDetalii(this)">Vezi detalii</button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function toggleDetalii(btn) {
            const card = btn.closest('.card');
            const detalii = card.querySelector('.detalii');
            const isOpen = detalii.classList.contains('open');
            detalii.classList.toggle('open', !isOpen);
            btn.textContent = isOpen ? 'Vezi detalii' : 'Ascunde detalii';
        }

        // Tab switching
        tabContainer.addEventListener('click', (e) => {
            const tab = e.target.closest('.tab');
            if (!tab) return;

            // Update active tab
            tabContainer.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            currentFilter = tab.dataset.marca;

            // Show/hide categories based on tab
            const tabCategories = tab.dataset.marca;
            if (tabCategories === 'PIECE') {
                visibleCategories = ['PIECE'];
            } else if (tabCategories === 'ELEC') {
                visibleCategories = ['ELEC'];
            } else if (tabCategories === 'TOATE') {
                visibleCategories = ['TOATE'];
            } else {
                visibleCategories = [tabCategories];
            }

            renderCards(currentFilter, currentFilter);
        });

        // Search
        searchInput.addEventListener('input', () => {
            renderCards(currentFilter, currentFilter);
        });

        // Initial render
        renderCards('PIECE', 'PIECE');
    </script>
