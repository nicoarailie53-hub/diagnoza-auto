<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagnoză Auto Pro — Coduri Eroare OBD2 & OEM</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e293b">
  <style>
    :root {
      --slate: #1e293b;
      --slate-light: #334155;
      --navy: #0284c7;
      --amber: #d97706;
      --amber-dark: #b45309;
      --royal: #1d4ed8;
      --purple: #6d28d9;
      --orange: #b45309;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-light: #64748b;
      --border: #e2e8f0;
      --shadow: 0 1px 3px rgba(0,0,0,0.12);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    header {
      background: var(--slate);
      color: white;
      padding: 1.5rem 1rem;
      text-align: center;
    }
    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    header h1 span { color: #38bdf8; }
    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .search-box {
      width: 100%;
      padding: 0.9rem 1rem;
      border: 2px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      background: var(--card-bg);
      transition: border-color 0.2s;
    }
    .search-box:focus {
      outline: none;
      border-color: var(--slate);
      box-shadow: 0 0 0 3px rgba(30,41,59,0.1);
    }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .tab {
      border: 2px solid transparent;
      padding: 0.6rem 1rem;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.9rem;
      color: white;
      transition: 0.15s;
    }
    .tab.active {
      opacity: 1;
      border-color: white;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }
    .tab-TOATE { background: #475569; }
    .tab-MB { background: #0284c7; }
    .tab-RENOULT { background: #d97706; }
    .tab-RENOULT.active { color: white; }
    .tab-VW { background: #1d4ed8; }
    .tab-PIECE { background: #6d28d9; }
    .tab-ELEC { background: #b45309; }
    .tab.active { opacity: 1; border-color: #fff; transform: translateY(-1px); }
    .tab:hover { opacity: 0.9; }
    .tab.active { opacity: 1; border-color: #fff; transform: translateY(-1px); }
    .results {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }
    @media (max-width: 600px) {
      .results { grid-template-columns: 1fr; }
      header h1 { font-size: 1.2rem; }
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      transition: box-shadow 0.2s;
    }
    .card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
    .card-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
    }
    .badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-cod {
      background: #e2e8f0;
      color: #1e293b;
    }
    .badge-marca {
      background: #cbd5e1;
      color: #1e293b;
    }
    .badge-sev {
      padding: 0.15rem 0.5rem;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: 700;
    }
    .badge-sev-Ridicată { background: #fee2e2; color: #b91c1c; }
    .badge-sev-Medie { background: #fef3c7; color: #92400e; }
    .badge-sev-Normală { background: #d1fae5; color: #065f46; }
    .badge-sev-Riscul oprirea motorului { background: #fce7f3; color: #9d174d; }
    .titlu {
      font-size: 1.05rem;
      font-weight: 700;
      color: #0f172a;
    }
    .sec {
      font-size: 0.92rem;
      color: #334155;
      margin-top: 0.25rem;
    }
    .causelist {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem 0.6rem;
    }
    .causelist span {
      background: #f1f5f9;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.82rem;
    }
    .detalii {
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
      display: none;
    }
    .detalii.open { display: block; }
    .detalii p {
      font-size: 0.85rem;
      color: #334155;
      margin: 0.3rem 0;
    }
    .btn-detalii {
      margin-top: 0.75rem;
      padding: 0.5rem 1rem;
      background: var(--slate);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      width: 100%;
      transition: 0.15s;
    }
    .btn-detalii:hover { background: #1e293b; }
    .no-results {
      text-align: center;
      padding: 2rem;
      color: var(--text-light);
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>
  <header>
    <h1>Diagnoză <span>Auto Pro</span> — Coduri Eroare OBD2 &amp; OEM</h1>
  </header>
  <main>
    <input type="text" id="searchInput" class="search-box" placeholder="Caută după cod, titlu, sistem, simptome sau cauze...">
    <div id="tabs" class="tabs">
      <button class="tab tab-TOATE active" data-marca="TOATE">TOATE</button>
      <button class="tab tab-MB" data-marca="MB">Mercedes-Benz</button>
      <button class="tab tab-RENOULT" data-marca="RENOULT">Renault</button>
      <button class="tab tab-VW" data-marca="VW">Volkswagen / VAG</button>
      <button class="tab tab-PIECE" data-marca="PIECE">Piese Origine OEM</button>
      <button class="tab tab-ELEC" data-marca="ELEC">Electrică &amp; Lumini</button>
    </div>
    <div id="results" class="results"></div>
  </main>
  <script>
    function filterByMarca(c) {
      const active = document.querySelector('.tab.active');
      const marca = active ? active.dataset.marca : 'TOATE';
      if (marca === 'TOATE') return true;
      if (marca === 'ELEC') return c.marca === 'ELEC';
      if (marca === 'PIECE') return c.marca === 'PIECE';
      return c.marca === marca;
    }
    function filterBySearch(c, q) {
      if (!q) return true;
      q = q.toLowerCase();
      return (
        (c.cod || '').toLowerCase().includes(q) ||
        (c.titlu || '').toLowerCase().includes(q) ||
        (c.sistem || '').toLowerCase().includes(q) ||
        (c.simptombe || '').toLowerCase().includes(q) ||
        (c.cauze || []).some(x => x.toLowerCase().includes(q))
      );
    }
    function renderResults() {
      const input = document.getElementById('searchInput');
      const q = input.value.trim();
      const active = document.querySelector('.tab.active');
      const marca = active ? active.dataset.marca : 'TOATE';
      const filtered = CODURI.filter(c => {
        if (marca !== 'TOATE' && c.marca !== marca) return false;
        if (!filterBySearch(c, q)) return false;
        return true;
      });
      const container = document.getElementById('results');
      if (filtered.length === 0) {
        container.innerHTML = '<div class="no-results">Nicio corespondență găsită.</div>';
        return;
      }
      container.innerHTML = filtered.map(c => {
        const sev = c.sev || 'Normală';
        const cauzeHtml = (c.cauze || []).map(x => '<span>' + escapeHtml(x) + '</span>').join('');
        return '' +
          '<div class="card">' +
            '<div class="card-top">' +
              '<span class="badge badge-cod">' + escapeHtml(c.cod) + '</span>' +
              '<span class="badge badge-marca">' + escapeHtml(c.marca) + '</span>' +
              '<span class="badge badge-sev badge-sev-' + escapeHtml(sev) + '">' + escapeHtml(sev) + '</span>' +
            '</div>' +
            '<div class="titlu">' + escapeHtml(c.titlu) + '</div>' +
            '<div class="sec"><strong>Descriere:</strong> ' + escapeHtml(c.exp) + '</div>' +
            '<div class="detalii open">' +
              '<p><strong>Explicație:</strong> ' + escapeHtml(c.exp) + '</p>' +
              '<p><strong>Cauze probabile:</strong> <div class="causelist">' + cauzeHtml + '</div></p>' +
              '<p><strong>Simptome:</strong> ' + escapeHtml(c.simptombe) + '</p>' +
              '<p><strong>Pași de verificare:</strong> ' + escapeHtml(c.verif) + '</p>' +
              '<button class="btn-detalii" onclick="this.parentElement.parentElement.querySelector('.detalii').classList.toggle('open')">Ascunde detalii</button>' +
            '</div>' +
          '</div>';
      }).join('');
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function(m) {
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
      });
    }
    document.getElementById('searchInput').addEventListener('input', renderResults);
    document.getElementById('tabs').addEventListener('click', function(e) {
      const btn = e.target.closest('.tab');
      if (!btn) return;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      renderResults();
    });
    renderResults();
  </script>
</body>
</html>
