<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Garaj / Diagnoză Auto - Coduri OBD2</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0f172a; color: #f1f5f9; padding: 16px; max-width: 820px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; background: #1e293b; border-radius: 12px; margin-bottom: 14px; border: 1px solid #334155; }
    h1 { font-size: 1.2rem; color: #38bdf8; }
    .sub { font-size: 0.78rem; color: #94a3b8; margin-top: 2px; }
    .btn-jurnal { background: #10b981; color: #06281e; border: none; padding: 9px 14px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.85rem; }
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .tab { border: 2px solid transparent; padding: 9px 14px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.85rem; color: #fff; opacity: 0.82; transition: 0.15s; }
    .tab.active { opacity: 1; border-color: #ffffff; transform: translateY(-1px); }
    .tab-TOATE { background: #475569; }
    .tab-MB { background: #0284c7; }
    .tab-RENAULT { background: #d97706; }
    .tab-VW { background: #1d4ed8; }
    .search-box { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #334155; background: #1e293b; color: #f8fafc; font-size: 0.95rem; margin-bottom: 12px; }
    .count { font-size: 0.85rem; color: #94a3b8; margin-bottom: 10px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 14px; margin-bottom: 10px; }
    .card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .badge-cod { font-weight: 800; font-size: 1.05rem; color: #38bdf8; }
    .badge-marca { font-size: 0.75rem; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: #334155; color: #e2e8f0; }
    .sev { font-size: 0.75rem; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
    .sev-Ridicată { background: #7f1d1d; color: #fecaca; }
    .sev-Medie { background: #78350f; color: #fde68a; }
    .sev-Normală { background: #047857; color: #bbf7d0; }
    .titlu { font-size: 0.98rem; font-weight: 600; margin: 8px 0 10px; color: #f8fafc; }
    .btn-detalii { width: 100%; background: #0f172a; color: #38bdf8; border: 1px solid #38bdf8; padding: 9px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .detalii { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid #334155; font-size: 0.9rem; line-height: 1.5; color: #cbd5e1; }
    .detalii.open { display: block; }
    .detalii p { margin-bottom: 8px; }
    .detalii strong { color: #f8fafc; }
    .jurnal-panel { display: none; background: #1e293b; border: 1px solid #10b981; border-radius: 12px; padding: 14px; margin-bottom: 14px; }
    .jurnal-panel.open { display: block; }
    .jurnal-panel input, .jurnal-panel select, .jurnal-panel textarea { width: 100%; padding: 9px; margin: 6px 0; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; }
    .jurnal-item { background: #0f172a; padding: 10px; border-radius: 8px; margin-top: 8px; display: flex; justify-content: space-between; align-items: center; }
    .jurnal-item .j-nota { font-size: 0.85rem; color: #94a3b8; max-width: 200px; margin-left: 10px; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Garaj / Diagnoză Auto</h1>
      <div class="sub">Caută și interpretează coduri de eroare OBD2</div>
    </div>
    <button class="btn-jurnal" onclick="toggleJurnal()">Jurnalul meu (<span id="jCount">0</span>)</button>
  </header>

  <div id="jurnalPanel" class="jurnal-panel">
    <h3 style="color:#10b981;margin-bottom:6px;">Jurnalul meu de cercetare</h3>
    <input id="jCod" placeholder="Cod eroare (ex: P0299, DF053)" />
    <select id="jMarca">
      <option value="Mercedes-Benz">Mercedes-Benz</option>
      <option value="Renault">Renault</option>
      <option value="Volkswagen / VAG">Volkswagen / VAG</option>
      <option value="General OBD2">General OBD2</option>
    </select>
    <textarea id="jNota" rows="2" placeholder="Notițe personale (simptome, piese verificate)..."></textarea>
    <button class="btn-jurnal" style="width:100%;margin-top:4px;" onclick="salveazaJurnal()">Salvează în jurnal</button>
    <div id="jLista"></div>
  </div>

  <div class="tabs">
    <button class="tab tab-TOATE active" onclick="setMarca('TOATE', this)">TOATE (OBD2)</button>
    <button class="tab tab-MB" onclick="setMarca('MB', this)">Mercedes-Benz</button>
    <button class="tab tab-RENAULT" onclick="setMarca('RENAULT', this)">Renault (DFxxx)</button>
    <button class="tab tab-VW" onclick="setMarca('VW', this)">Volkswagen / VAG</button>
  </div>

  <input id="searchInput" class="search-box" oninput="renderLista()" placeholder="Caută cod (ex: P0300, DF053, 17965) sau cuvânt cheie (turbină, EGR, DPF)..." />
  <div id="rezCount" class="count"></div>
  <div id="listaCoduri"></div>

  <script>
    const CODURI = [
      { cod: "P0300", marca: "TOATE", sistem: "Motor / Aprindere", sev: "Ridicată", titlu: "Rateuri de aprindere detectate pe mai mulți cilindri", exp: "Calculatorul motorului detectează arderi incomplete aleatorii pe mai mulți cilindri.", cauze: ["Bujii uzate", "Bobine de inducție defecte", "Inintoare înfundate", "Presiune slabă combustibil", "Aer fals în admisie"], verif: "Verifică bujiile, bobinele și presiunea în rampa de combustibil." },
      { cod: "P0299", marca: "TOATE", sistem: "Turbină / Supraalimentare", sev: "Ridicată", titlu: "Presiune scăzută de supraalimentare (Underboost)", exp: "Turbina nu produce suficientă supraalimentare pentru regimul cerut.", cauze: ["Furtun vacuum slăbit", "Actuator VGT moart", "Senzor presiune blocat", "Circuit exaustă obstrucționat"], verif: "Verifică furtunul vacuum și activitatea actuatorului VGT." },
      { cod: "P0401", marca: "TOATE", sistem: "Emisii / EGR", sev: "Medie", titlu: "Debit insuficient recirculare gaze (EGR)", exp: "Supapa EGR nu lasă să treacă suficient gaz evacuat înapoi în admisie.", cauze: ["Supapa EGR blocată cu calamină", "Conducte EGR înfundate", "Senzor presiune diferențială defect"], verif: "Curăță supapa EGR și verifică dacă tija culisează ușor." },
      { cod: "P0420", marca: "TOATE", sistem: "Evacuare / Catalizator", sev: "Medie", titlu: "Eficiență catalizator sub pragul admis (Banc 1)", exp: "Sonda lambda de după catalizator arată că acesta nu mai filtrează corect.", cauze: ["Catalizator uzat", "Sondă lambda 2 defectă", "Scăpări pe evacuare înainte de sondă"], verif: "Compară valorile sondelor lambda 1 și 2 pe tester la relanti la cald." },
      { cod: "P2002", marca: "TOATE", sistem: "Filtru particule DPF", sev: "Ridicată", titlu: "Eficiență filtru de particule diesel (DPF) sub limită", exp: "Filtrul DPF este colmatat sau nu reușește să finalizeze regenerarea.", cauze: ["Drumuri scurte în oraș", "Senzor presiune diferențială DPF defect", "Termostat blocat deschis"], verif: "Citește gradul de încărcare cu funingine (g) și presiunea diferențială." },
      { cod: "P0087", marca: "MB", sistem: "Mercedes-Benz Injecție", sev: "Ridicată", titlu: "Presiune prea mică în rampa comună (Common Rail)", exp: "Presiunea măsurată în rampă este mult sub cea cerută de ECU.", cauze: ["Filtru motorină înfundat", "Regulator presiune rampă defect", "Pompă înaltă presiune uzată"], verif: "Înlocuiește filtrul de motorină și verifică returul injectoarelor." },
      { cod: "P2015", marca: "MB", sistem: "Mercedes-Benz Admisie", sev: "Medie", titlu: "Senzor poziție clapete galerie admisie (Swirl flaps)", exp: "Servomotorul sau tija clapetelor din galeria de admisie nu ajunge la poziția comandată.", cauze: ["Depuneri de ulei și funingine pe clapete", "Tijă ruptă", "Motoraș M55 defect"], verif: "Inspectează vizual tija de sub galeria de admisie la punerea contactului." },
      { cod: "P0380", marca: "MB", sistem: "Mercedes-Benz Preîncălzire", sev: "Medie", titlu: "Circuit buji incandescente / releu preîncălzire", exp: "Una sau mai multe bujii incandescente arse sau releul nu comandă.", cauze: ["Buji incandescente arse", "Releu preîncălzire defect", "Cablaj oxidat"], verif: "Măsoară rezistența fiecărei bujii cu multimetrul (trebuie să fie sub 1-2 Ohmi)."},
      { cod: "P0455", marca: "MB", sistem: "Mercedes-Benz Evap", sev: "Medie", titlu: "Golire majoră sistem EVAP", exp: "Liberarea excesivă de gaze din rezervorul de combustibil către evacuare.", cauze: ["Canister EVAP blocat", "Vălvă EVAP moartă", "Conduși EVAP rupși"], verif: "Verifică canisterul EVAP și circuitul de evacuare a golirii." },
      { cod: "P0456", marca: "MB", sistem: "Mercedes-Benz Evap", sev: "Normală", titlu: "Golire mică sistem EVAP", exp: "Pickă de gaze din rezervor recunoscută de către ECU.", cauze: ["Fugere mici în circuit EVAP", "Conexiune EVAP ușor defectă", "Freză obosită la conexiune EVAP"], verif: "Inspecționează toate conexiunile EVAP pentru fugere mici." },
      { cod: "P0403", marca: "MB", sistem: "Mercedes-Benz EGR", sev: "Medie", titlu: "Circuit EGR deschis (open circuit)", exp: "Circuitul electric de control al suprappei EGR este întrerupt.", cauze: ["Cablaj EGR răcit", "Conexiune EGR oxitanțată", "Releu EGR defect"], verif: "Măsoară rezistența circuitului electric EGR cu multimetrul." },
      { cod: "DF053", marca: "RENAULT", sistem: "Renault Injecție 1.5 dCi", sev: "Ridicată", titlu: "Funcție reglare presiune rampă injecție", exp: "Presiunea în rampa Common Rail este peste sau sub limita cerută.", cauze: ["Regulator presiune pompă (IMV) blocat", "Aer pe circuitul de motorină", "Inontoare cu retur mare"], verif: "Verifică dacă sunt bule de aer pe conducta transparentă de motorină și fă testul de retur." },
      { cod: "DF025", marca: "RENAULT", sistem: "Renault Preîncălzire", sev: "Medie", titlu: "Circuit releu / buji incandescente", exp: "Una sau mai multe bujii incandescente arse sau releul nu comandă.", cauze: ["Buji incandescente arse", "Releu preîncălzire defect", "Cablaj oxidat"], verif: "Măsoară rezistența fiecărei bujii cu multimetrul (trebuie să fie sub 1-2 Ohmi)."},
      { cod: "DF1012", marca: "RENAULT", sistem: "Renault Motor", sev: "Medie", titlu: "Eroare circuit buji incandescente / releu preîncălzire", exp: "Circuitul bujiilor incandescente este defect, afectând pornirea motorului.", cauze: ["Buji incandescente arse", "Releu preîncălzire moart", "Cablaj de alimentare ROS defective"], verif: "Verifică cablajele ROS și măsoară rezistența fiecărei bujii." },
      { cod: "DF004", marca: "RENAULT", sistem: "Renault Supraalimentare", sev: "Medie", titlu: "Senzor presiune supraalimentare (MAP)", exp: "Senzorul MAP trimite date greșite de presiune la sistemul de supraalimentare.", cauze: ["Senzor MAP moart", "Aer pe circuit MAP", "Cablaj senzor oxidanțat"], verif: "Verifică semnalele senzorului MAP cu diagnotigatorul și comparați cu tabelul." },
      { cod: "DF1011", marca: "RENAULT", sistem: "Renault EGR", sev: "Medie", titlu: "Preluare EGR excesivă", exp: "EGRu preia prea multe gaze, reducând puterea și creștând consumul.", cauze: ["Valvă EGR moartă (se deschide prea mult)", "Furră în canal EGR", "Circuit EGR colmatat"], verif: "Spăla circuit EGR, verifică valvă și canalurile." },
      { cod: "DF800", marca: "RENAULT", sistem: "Renault VGT", sev: "Medie", titlu: "Control geometrie variabilă turbină (VGT)", exp: "Sistemul de control al geometriei turbinelor nu funcționează corect.", cauze: ["Actuator VGT moart", "Senzor de presiune cameră de admisie", "Circuit de comutare VGT defect"], verif: "Verifică cu diagnotigatorul semnalele actuatorului VGT și presiunea camerii de admisie." },
      { cod: "17965", marca: "VW", sistem: "VAG Turbină", sev: "Ridicată", titlu: "Presiune supraalimentare depășită (Overboost)", exp: "Supraalimentarea depășește limita de siguranță, adesea cauzată de blocare mecanică.", cauze: ["Electrovalvă N75 moartă", "Galerie admisie blocată", "Senzor de presiune N75 defect"], verif: "Verifică electrovalvă N75 și semnalele senzorului de presiune de supraalimentare." },
      { cod: "16683", marca: "VW", sistem: "VAG Turbină", sev: "Ridicată", titlu: "Presiune supraalimentare sub limită (Underboost)", exp: "Turbina nu produce suficientă supraalimentare, de obicei din cauza furtunului vacuum.", cauze: ["Furtun vacuum rupt", "Actuator VGT moart", "Senzor de presiune scăzut"], verif: "Verifică furtunul vacuum și activitatea cu diagnotigatorul." },
      { cod: "17552", marca: "VW", sistem: "VAG Admisie", sev: "Ridicată", titlu: "Debitmetru aer (MAF G70) — circuit întrerupt", exp: "MAF G70 nu trimite date corect, afectând controlul masă de aer.", cauze: ["Sensor MAF moart", "Sensor MAF corupt de căldură", "Conexiune MAF defectă"], verif: "Verifică senzorul MAF cu diagnotigatorul și spală senzorul dacă este murdar." },
      { cod: "16785", marca: "VW", sistem: "VAG EGR", sev: "Medie", titlu: "Sistem EGR — debit insuficient", exp: "EGRu trăde prea puține gaze, reducând eficiența filtrarei emisiilor.", cauze: ["Valvă EGR blocată de căldură", "Furră în canal EGR", "Senzor EGR defect"], verif: "Spăla circuit EGR și verifica valvă și canalurile." },
      { cod: "16682", marca: "VW", sistem: "VAG EGR", sev: "Medie", titlu: "EGRu rece — debit prea scăzut (P0411)", exp: "EGRu rece nu trăde la temperatura de referință, afectând reducerea poluăriilor.", cauze: ["EGRu ars sau cuplu defect", "Furră în canal EGR", "Senzor de temperatură EGR defect"], verif: "Verifică temperatura EGR cu senzor și spală circuitul." },
      { cod: "17941", marca: "VW", sistem: "VAG EGR", sev: "Medie", titlu: "EGRu — debit prea mare / EGR inactivat", exp: "EGRu trăde prea multe gaze sau nu este controlat corect.", cauze: ["Valvă EGR moartă (se deschide prea mult)", "Senzor de presiune EGR defect", "Circuit de comutare EGR defect"], verif: "Verifică valvă EGR și circuitul de comutare." },
      { cod: "P0505", marca: "TOATE", sistem: "Motor / Surse de energie", sev: "Normală", titlu: "Controlul sursei de energie – tensiune scăzută", exp: "Tensiunea la sursa de energie este scăzută, afectând performanța și emisiile.", cauze: ["Tensiune slabă la baterie", "Baterie slăbă sau învechită", "Cablaj greșit la sursă", "Alternator defect"], verif: "Verifică bateria și alternatorul, cablajele și tensiunea la sursa de energie." }
    ];
  </script>

  <script>
    // ===== Jurnal =====
    const state = { jurnal: JSON.parse(localStorage.getItem('jurnalDiagnoza') || '[]') };

    function loadJurnal() {
      document.getElementById('jCount').textContent = state.jurnal.length;
      renderJurnal();
    }

    function renderJurnal() {
      const container = document.getElementById('jLista');
      container.innerHTML = '';
      state.jurnal.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = 'jurnal-item';
        div.innerHTML = '<strong>' + item.marca + ' ' + item.cod + '</strong><span class="j-nota">' + escapeHtml(item.nota) + '</span><button onclick="stergeJurnal(' + idx + ')" style="background:#ef4444;color:#fff;border:none;padding:4px 8px;border-radius:4px;font-size:0.75rem;cursor:pointer;">Șterge</button>';
        container.appendChild(div);
      });
    }

    function salveazaJurnal() {
      const cod = document.getElementById('jCod').value.toUpperCase();
      const marca = document.getElementById('jMarca').value;
      const nota = document.getElementById('jNota').value.trim();
      if (!cod) { alert('Te rog introdu un cod eroare.'); return; }
      state.jurnal.push({ cod: cod, marca: marca, nota: nota, data: new Date().toLocaleString() });
      document.getElementById('jCount').textContent = state.jurnal.length;
      localStorage.setItem('jurnalDiagnoza', JSON.stringify(state.jurnal));
      renderJurnal();
      document.getElementById('jCod').value = '';
      document.getElementById('jNota').value = '';
      alert('Notița a fost salvată în jurnal!');
    }

    function stergeJurnal(idx) {
      state.jurnal.splice(idx, 1);
      document.getElementById('jCount').textContent = state.jurnal.length;
      localStorage.setItem('jurnalDiagnoza', JSON.stringify(state.jurnal));
      renderJurnal();
    }

    function toggleJurnal() {
      const panel = document.getElementById('jurnalPanel');
      panel.classList.toggle('open');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ===== Filterare taburi =====
    function setMarca(marca, el) {
      state.marca = marca;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      renderLista();
    }

    function filterByMarca(cod) {
      if (state.marca === 'TOATE') return true;
      if (state.marca === 'General OBD2') return cod.marca === 'TOATE';
      return cod.marca === state.marca;
    }

    function filterBySearch(cod) {
      if (!state.search) return true;
      const q = state.search.toLowerCase();
      const codLower = (cod.cod || '').toLowerCase();
      const titluLower = (cod.titlu || '').toLowerCase();
      const sistemLower = (cod.sistem || '').toLowerCase();
      const cauzeLower = (cod.cauze || []).join(' ').toLowerCase();
      return codLower.includes(q) || titluLower.includes(q) || sistemLower.includes(q) || cauzeLower.includes(q);
    }

    function renderLista() {
      const lista = document.getElementById('listaCoduri');
      const countEl = document.getElementById('rezCount');
      const allCodes = CODURI.filter(c => filterByMarca(c) && filterBySearch(c));
      countEl.textContent = 'Afisează ' + allCodes.length + ' rezultate';
      lista.innerHTML = '';
      if (allCodes.length === 0) {
        lista.innerHTML = '<div style="color:#94a3b8;padding:20px;text-align:center;">Nicio corespondență găsită.</div>';
        return;
      }
      allCodes.forEach(cod => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML =
          '<div class="card-top">' +
          '<span class="badge-cod">' + cod.cod + '</span>' +
          '<span class="badge-marca">' + cod.marca + '</span>' +
          '<span class="sev sev-' + cod.sev + '">' + cod.sev + '</span>' +
          '</div>' +
          '<div class="titlu">' + cod.titlu + '</div>' +
          '<button class="btn-detalii" onclick="toggleDetalii(this)">Vezi detalii complete</button>' +
          '<div class="detalii">' +
          '<p><strong>Descriere:</strong> ' + cod.titlu + '</p>' +
          '<p><strong>Explicație:</strong> ' + cod.exp + '</p>' +
          '<p><strong>Cauze probabile:</strong> ' + cod.cauze.join(', ') + '</p>' +
          '<p><strong>Simptome:</strong> Increțește puterea, rușine mecanistică, consum mai mare, emisii neregulate.</p>' +
          '<p><strong>Pași de verificare:</strong> ' + cod.verif + '</p>' +
          '</div>';
        lista.appendChild(card);
      });
    }

    function toggleDetalii(btn) {
      const card = btn.parentElement;
      const detalii = card.querySelector('.detalii');
      detalii.classList.toggle('open');
      btn.textContent = detalii.classList.contains('open') ? 'Ascunde detalii' : 'Vezi detalii complete';
    }

    // Inicializare
    document.addEventListener('DOMContentLoaded', function() {
      loadJurnal();
      renderLista();
    });
  </script>
</body>
</html>
