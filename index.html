<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagnoză Auto Pro — Coduri Eroare OBD2 & OEM</title>
  <meta name="theme-color" content="#1e293b">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: Segoe UI, system-ui, sans-serif; background:#f8fafc; color:#1e293b; }
    header { background:#1e293b; color:white; padding:1rem; text-align:center; }
    header h1 { font-size:1.25rem; font-weight:700; }
    header h1 span { color:#38bdf8; }
    main { max-width:1000px; margin:0 auto; padding:1rem; }
    .search-box { width:100%; padding:0.8rem 1rem; border:2px solid #334155; border-radius:10px; font-size:1rem; background:#1e293b; color:white; }
    .search-box:focus { outline:none; border-color:#38bdf8; }
    .tabs { display:flex; flex-wrap:wrap; gap:0.5rem; margin-bottom:1rem; }
    .tab { border:2px solid transparent; padding:0.55rem 1rem; border-radius:8px; font-weight:700; cursor:pointer; font-size:0.85rem; color:white; transition:0.15s; }
    .tab.active { opacity:1; border-color:#fff; transform:translateY(-1px); }
    .tab-TOATE { background:#64748b; }
    .tab-MB { background:#1e3a8a; }
    .tab-RENAULT { background:#b45309; }
    .tab-VW { background:#1d4ed8; }
    .tab-PIECE { background:#6d28d9; }
    .tab-ELEC { background:#b45309; }
    .tab.active { box-shadow: 0 0 0 2px #fff; }
    .tab.active.TOATE { background:#475569; }
    .tab.active.MB { background:#1e3a8a; }
    .tab.active.RENAULT { background:#b45309; }
    .tab.active.VW { background:#1d4ed8; }
    .tab.active.PIECE { background:#6d28d9; }
    .tab.active.ELEC { background:#b45309; }
    .no-results { padding:2rem; text-align:center; color:#64748b; }
    .row { display:grid; grid-template-columns: 1fr 1fr; gap:1rem; }
    .card { border:1px solid #e2e8f0; border-radius:8px; padding:1rem; background:white; }
    .card-top { display:flex; gap:0.5rem; margin-bottom:0.5rem; flex-wrap:wrap; }
    .badge { display:inline-block; padding:0.25rem 0.5rem; border-radius:4px; font-size:0.75rem; font-weight:700; color:white; text-transform:uppercase; }
    .badge-cod { background:#3b82f6; }
    .badge-marca { background:#64748b; }
    .badge-sev { padding:0.25rem 0.4rem; }
    .badge-sev-Ridicată { background:#ef4444; }
    .badge-sev-Medie { background:#f59e0b; }
    .badge-sev-Normală { background:#10b981; }
    .titlu { font-weight:700; margin-bottom:0.5rem; }
    .sec { background:#f1f5f9; padding:0.5rem; border-radius:4px; margin-bottom:0.5rem; }
    .detalii { border-top:1px solid #e2e8f0; padding-top:0.5rem; display:none; }
    .detalii.open { display:block; }
    .causelist { display:grid; grid-template-columns: 1fr 1fr; gap:0.25rem; margin:0.25rem 0; }
    .causelist span { background:#e0f2fe; color:#0369a1; padding:0.2rem 0.4rem; border-radius:3px; font-size:0.75rem; }
    .btn-detalii { margin-top:0.5rem; padding:0.4rem 1rem; background:#3b82f6; color:white; border:none; border-radius:4px; cursor:pointer; font-size:0.8rem; }
    .btn-detalii:hover { background:#2563eb; }
    .status { padding:0.5rem; background:#dcfce7; color:#166534; border-radius:4px; font-size:0.85rem; margin-bottom:1rem; }
    .status.error { background:#fee2e2; color:#991b1b; }
    @media (max-width: 600px) {
      .row { grid-template-columns: 1fr; }
      .causelist { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  </header>

    </div>
    <div class="tabs" id="tabs">

    </div>
    <div id="results"></div>
  </main>

function filterByMarca(c) {
  const active = document.querySelector('.tab.active');
  const marca = active ? active.dataset.marca : 'TOATE';
  if (marca === 'TOATE') return true;
  if (marca === 'ELEC') return c.marca === 'ELEC';
  if (marca === 'PIECE') return c.marca === 'PIECE';
  return c.marca === marca;
}

function filterBySearch(c, q) {
  if (!q) return true;
  q = q.toLowerCase();
  return (
    (c.cod || '').toLowerCase().includes(q) ||
    (c.titlu || '').toLowerCase().includes(q) ||
    (c.sistem || '').toLowerCase().includes(q) ||
    (c.simptome || '').toLowerCase().includes(q) ||
    (c.cauze || []).some(x => x.toLowerCase().includes(q))
  );
}

function renderResults() {
  const input = document.getElementById('searchInput');
  const q = input.value.trim();
  const active = document.querySelector('.tab.active');
  const marca = active ? active.dataset.marca : 'TOATE';
  const filtered = CODURI.filter(c => {
    if (marca !== 'TOATE' && c.marca !== marca) return false;
    if (!filterBySearch(c, q)) return false;
    return true;
  });
  const container = document.getElementById('results');
  if (filtered.length === 0) {
    container.innerHTML = '<div class="no-results">Nicio corespondență găsită.</div>';
    return;
  }
  container.innerHTML = filtered.map(c => {
    const sev = c.sev || 'Normală';
    const cauzeHtml = (c.cauze || []).map(x => '<span>' + escapeHtml(x) + '</span>').join('');
    return '' +
      '<div class="card">' +
        '<div class="card-top">' +
          '<span class="badge badge-cod">' + escapeHtml(c.cod) + '</span>' +
          '<span class="badge badge-marca">' + escapeHtml(c.marca) + '</span>' +
          '<span class="badge badge-sev badge-sev-' + escapeHtml(sev) + '">' + escapeHtml(sev) + '</span>' +
        '</div>' +
        '<div class="titlu">' + escapeHtml(c.titlu) + '</div>' +
        '<div class="sec"><strong>Descriere:</strong> ' + escapeHtml(c.exp) + '</div>' +
        '<div class="detalii">' +
          '<p><strong>Explicație:</strong> ' + escapeHtml(c.exp) + '</p>' +
          '<p><strong>Cauze probabile:</strong> <div class="causelist">' + cauzeHtml + '</div></p>' +
          '<p><strong>Simptome:</strong> ' + escapeHtml(c.simptome) + '</p>' +
          '<p><strong>Pași de verificare:</strong> ' + escapeHtml(c.verif) + '</p>' +
        '</div>' +
        '<button class="btn-detalii">Vezi detalii</button>' +
      '</div>';
  }).join('');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(m) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
  });
}

// Tab switching
document.getElementById('tabs').addEventListener('click', function(e) {
  const btn = e.target.closest('.tab');
  if (!btn) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderResults();
});

// Search
document.getElementById('searchInput').addEventListener('input', renderResults);

// Detalii toggle
document.getElementById('results').addEventListener('click', function(e) {
  if (e.target.closest('.btn-detalii')) {
    const btn = e.target.closest('.btn-detalii');
    const card = btn.closest('.card');
    const detalii = card.querySelector('.detalii');
    const isOpen = detalii.classList.contains('open');
    detalii.classList.toggle('open');
    // Switch button label: "Vezi detalii" -> "Ascunde detalii" or vice versa
    btn.textContent = isOpen ? 'Vezi detalii' : 'Ascunde detalii';
  }
});

renderResults();
</script>
</body>
</html>
