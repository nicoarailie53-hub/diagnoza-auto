<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="64" height="64" rx="16" fill="#1A1A2E"/>
  
  <!-- Stylized geometric flower/rosette emblem -->
  <!-- Outer gold ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#F59E0B" stroke-width="3"/>
  
  <!-- Petals - gold and blue alternating -->
  <g fill="#F59E0B">
    <ellipse cx="32" cy="10" rx="14" ry="10"/>
    <ellipse cx="32" cy="54" rx="14" ry="10"/>
    <ellipse cx="10" cy="32" rx="14" ry="10"/>
    <ellipse cx="54" cy="32" rx="14" ry="10"/>
  </g>
  <g fill="#059669">
    <ellipse cx="32" cy="18" rx="11" ry="8"/>
    <ellipse cx="32" cy="46" rx="11" ry="8"/>
    <ellipse cx="18" cy="32" rx="11" ry="8"/>
    <ellipse cx="46" cy="32" rx="11" ry="8"/>
  </g>
  
  <!-- Center hub -->
  <circle cx="32" cy="32" r="10" fill="#1E3A8A"/>
  <circle cx="32" cy="32" r="6" fill="#F59E0B"/>
  <circle cx="32" cy="32" r="3" fill="#059669"/>
  
  <!-- Car diagnostic pulse lines (3 radiating arcs) -->
  <g stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round">
    <path d="M 32 18 A 14 14 0 0 1 46 32"/>
    <path d="M 32 46 A 14 14 0 0 1 18 32"/>
    <path d="M 18 32 A 14 14 0 0 1 32 18"/>
    <path d="M 46 32 A 14 14 0 0 1 32 46"/>
  </g>
  
  <!-- Pulse wave circles -->
  <circle cx="32" cy="32" r="4" fill="#059669"/>
  <circle cx="32" cy="32" r="6" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0.6"/>
  <circle cx="32" cy="32" r="8" fill="none" stroke="#059669" stroke-width="2" opacity="0.6"/>
  
  <!-- Wrench / diagnostic tool symbol -->
  <g stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M 32 28 L 26 34 L 25 34 L 28 40 L 36 40 L 35 34 L 34 34 L 30 28"/>
  </g>
  
  <!-- Diagnostic pulse dots -->
  <circle cx="32" cy="18" r="1.5" fill="#F59E0B"/>
  <circle cx="46" cy="32" r="1.5" fill="#059669"/>
  <circle cx="32" cy="46" r="1.5" fill="#F59E0B"/>
  <circle cx="18" cy="32" r="1.5" fill="#059669"/>
</svg>
